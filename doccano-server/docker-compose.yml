version: "3.8"

services:
  doccano:
    image: doccano/doccano:latest
    container_name: doccano
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ADMIN_USERNAME=admin
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=StrongPass123
    volumes:
      - doccano_data:/data

volumes:
  doccano_data:
